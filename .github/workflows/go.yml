---
name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

permissions: {}

jobs:
  go:
    permissions:
      contents: read
      statuses: write
    uses: openconfig/common-ci/.github/workflows/go.yml@49fc521890a243722b1fd43d70d170e46602a787
    with:
      go-versions: "['1.x']"
      # Exclude the top-level Monax integration test runner (test/enrollz) from unit
      # test runs, as it requires a live Kubernetes cluster (kind), a physical/virtual
      # DUT switch, and a vendor-specific caservice PKI implementation.
      # Unit tests under test/enrollz/sut/controller still run.
      tests-excludes-regex: "github.com/openconfig/attestz/test/enrollz$"
      race-tests-excludes-regex: "github.com/openconfig/attestz/test/enrollz$"
