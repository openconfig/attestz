---
name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

permissions: {}

jobs:
  go:
    permissions:
      contents: read
      statuses: write
    uses: openconfig/common-ci/.github/workflows/go.yml@49fc521890a243722b1fd43d70d170e46602a787
    with:
      go-versions: "['1.x']"
      # Exclude the top-level integration test runners (test/enrollz and
      # test/attestz) from unit test runs, as they require a running SUT
      # (Monax/Kubernetes or bare metal), a physical/virtual DUT switch, and a
      # vendor-specific caservice PKI implementation.
      # Unit tests under subpackages (e.g. sut/controller, pcrprovider, tpmutil) still run.
      coverage-excludes-regex: "github.com/openconfig/attestz/test/(enrollz|attestz)$"
      tests-excludes-regex: "github.com/openconfig/attestz/test/(enrollz|attestz)$"
      race-tests-excludes-regex: "github.com/openconfig/attestz/test/(enrollz|attestz)$"
