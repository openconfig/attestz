syntax = "proto3";

package openconfig.attestz.test.attestz;

import "github.com/openconfig/attestz/proto/common_definitions.proto";
import "google/rpc/status.proto";

option go_package = "github.com/openconfig/attestz/test/attestz/proto";

// Controller defines the System Under Test (SUT) management interface for the
// Attestz integration test suite.
//
// In a Monax integration test, test cases invoke this Controller service to
// drive the TPM 2.0 Attestz remote attestation workflow against a target
// Device Under Test (DUT).
service Controller {
  // Initiates the TPM 2.0 Attestz workflow for a target control card on the
  // DUT, requesting PCR quotes and validating attestation evidence.
  rpc AttestDevice(AttestDeviceRequest) returns (AttestDeviceResponse);
}

// AttestDeviceRequest contains connection parameters, target hardware
// specifications, and cryptographic parameters required to execute the Attestz
// remote attestation workflow against a DUT.
message AttestDeviceRequest {
  // Target IP address or resolvable hostname (FQDN) of the Device Under
  // Test (DUT).
  string host = 1;

  // Target port for the gNSI/Attestz service running on the DUT.
  // Defaults to "9339" (gNSI port) if unspecified.
  string port = 2;

  // The control card roles to attest on the DUT (e.g., [ACTIVE, STANDBY]).
  // The types of control cards supported (e.g., ACTIVE, STANDBY, CHASSIS)
  // depend on the DUT.
  //   - ACTIVE: Primary supervisor or single control processor.
  //   - STANDBY: Backup supervisor in dual-supervisor modular chassis.
  //   - CHASSIS: Physical chassis enclosure module (proxied via the ACTIVE
  //   card).
  repeated openconfig.attestz.ControlCardRole control_card_roles = 3;

  // Cryptographically secure random challenge nonce generated by the verifier
  // (Controller) to ensure quote freshness and prevent replay attacks during
  // PCR quoting.
  bytes nonce = 4;

  // Hash algorithm of the TPM 2.0 PCR bank to quote (e.g.,
  // TPM_2_0_HASH_ALGO_SHA384).
  openconfig.attestz.Tpm20HashAlgo hash_algo = 5;
}

// AttestDeviceResponse reports the outcome of the Attestz attestation workflow.
message AttestDeviceResponse {
  // Information and attestation status for each control card attempted.
  repeated ControlCardAttestationResult card_results = 1;
}

// ControlCardAttestationResult carries the outcome and artifacts for a single
// card.
message ControlCardAttestationResult {
  // The control card role that was attested (ACTIVE, STANDBY, or CHASSIS).
  openconfig.attestz.ControlCardRole control_card_role = 1;

  // The status of this specific card:
  // - OK (0): Card was successfully attested (oIAK cert verified, PCR quote
  //   signature verified, and PCR values matched expected digests).
  // - FAILED_PRECONDITION: Attestation verification failed on evidence
  //   presented by the DUT (e.g., invalid oIAK cert, quote signature
  //   verification failed, nonce mismatch, or PCR value mismatch).
  // - UNAVAILABLE: DUT communication or Attest RPC failed for this card.
  google.rpc.Status status = 2;

  // Artifacts and diagnostic metadata associated with this control card.
  //
  // Implementers may add more fields on both successful and failed
  // attestation attempts to assist with verification and troubleshooting
  // (e.g., returning observed PCR values, PCR quotes, quote signatures,
  // certificates, or event logs). Implementations may extend this message with
  // additional artifacts as needed.
}