# Example: Kubernetes Secret for mounting Owner CA certificate and private key.
apiVersion: v1
kind: Secret
metadata:
  name: attestz-ca-certs
  annotations:
    checkov.io/skip1: CKV_K8S_21=Namespace is dynamically injected by Monax at runtime
type: Opaque
stringData:
  ownerca.crt: |
    # Paste your Owner Root CA Certificate PEM here
    # (-----BEGIN/END CERTIFICATE-----)
  ownerca.key: |
    # Paste your Owner Private Key PEM here
    # (-----BEGIN/END PRIVATE KEY-----)