# Example: Kubernetes Secret for overriding default test CA certificates with real vendor hardware keys.
apiVersion: v1
kind: Secret
metadata:
  # Namespace is omitted intentionally; Monax dynamically provisions and injects
  # an ephemeral namespace (monax-<uuid>) at test runtime.
  name: enrollz-custom-certs
type: Opaque
stringData:
  vendorca.crt: |
    -----BEGIN CERTIFICATE-----
    # Paste your Vendor Hardware Root CA Certificate PEM here
    -----END CERTIFICATE-----
  ownerca.crt: |
    -----BEGIN CERTIFICATE-----
    # Paste your Owner Root CA Certificate PEM here
    -----END CERTIFICATE-----
  ownerca.key: |
    -----BEGIN PRIVATE KEY-----
    # Paste your Owner Private Key PEM here
    -----END PRIVATE KEY-----
