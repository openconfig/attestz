# Example: Kubernetes Secret for overriding default test CA certificates with real vendor hardware keys.
apiVersion: v1
kind: Secret
metadata:
  name: enrollz-custom-certs
  annotations:
    checkov.io/skip1: CKV_K8S_21=Namespace is dynamically injected by Monax at runtime
type: Opaque
stringData:
  vendorca.crt: |
    # Paste your Vendor Hardware Root CA Certificate PEM here
    # (-----BEGIN/END CERTIFICATE-----)
  ownerca.crt: |
    # Paste your Owner Root CA Certificate PEM here
    # (-----BEGIN/END CERTIFICATE-----)
  ownerca.key: |
    # Paste your Owner Private Key PEM here
    # (-----BEGIN/END PRIVATE KEY-----)
