syntax = "proto3";

package openconfig.attestz.test;

import "github.com/openconfig/attestz/proto/common_definitions.proto";
import "google/rpc/status.proto";

option go_package = "github.com/openconfig/attestz/test/enrollz/proto";

// Controller defines the System Under Test (SUT) management interface for the
// Enrollz integration test suite.
//
// In a Monax integration test, test cases invoke this Controller service to
// drive the TPM 2.0 Enrollz workflow against a target Device Under Test (DUT).
service Controller {
  // Initiates the TPM 2.0 Enrollz workflow for a specific control card on the
  // DUT.
  rpc EnrollDevice(EnrollDeviceRequest) returns (EnrollDeviceResponse);
}

// EnrollDeviceRequest contains the connection parameters and target hardware
// specifications required to execute the Enrollz workflow against a DUT.
message EnrollDeviceRequest {
  // Target IP address of the Device Under Test (DUT).
  string ip_address = 1;

  // Optional: Resolvable hostname or FQDN of the DUT.
  string hostname = 2;

  // Target port for the gNSI service running on the DUT.
  // The default value is "9339" (gNSI port).
  string port = 3;

  // The control card roles to enroll (e.g., [ACTIVE, STANDBY]). The types of
  // control cards supported (e.g., ACTIVE, STANDBY, CHASSIS) depend on the DUT.
  //   - ACTIVE: Primary supervisor or single control processor.
  //   - STANDBY: Backup supervisor in dual-supervisor modular chassis.
  //   - CHASSIS: Physical chassis enclosure module (proxied via the ACTIVE
  //   card).
  repeated openconfig.attestz.ControlCardRole control_card_roles = 4;

  // The SSL profile identifier on the DUT where the re-certified owner IDevID
  // (oIDevID) certificate will be bound for TLS authentication. Required
  // whenever oIDevID is rotated.
  string ssl_profile_id = 5;
}

// EnrollDeviceResponse reports the outcome of the Enrollz enrollment workflow.
message EnrollDeviceResponse {
  // Information and status for each control card attempted.
  repeated ControlCardEnrollmentResult card_results = 1;
}

// ControlCardEnrollmentResult carries the outcome and artifacts for a single
// card.
message ControlCardEnrollmentResult {
  // The control card role that was enrolled (ACTIVE, STANDBY, or CHASSIS).
  openconfig.attestz.ControlCardRole control_card_role = 1;

  // The status of this specific card:
  // - OK (0): Card was successfully enrolled.
  // - FAILED_PRECONDITION: DUT cert verification failed (e.g. serial mismatch,
  // cert verify failed, etc).
  // - UNAVAILABLE: DUT communication or GetIakCert failed for this card.
  google.rpc.Status status = 2;

  // Artifacts and diagnostic metadata associated with this control card.
  //
  // Implementers may add more fields on both successful and failed
  // enrollment attempts to assist with verification and troubleshooting
  // (e.g., returning observed certificates, serial numbers, etc).
  // Implementations may extend this  message with additional artifacts as
  // needed.
}
