[files]
extend-exclude=[
    # Exclude test certificate fixtures: base64-encoded PEM strings contain random
    # character sequences that trigger false-positive spell-check errors.
    "test/enrollz/sut/controller/certs_test.go",
    # Exclude Go module dependency and checksum files containing hashes/hashes-like strings.
    "**/go.mod",
    "**/go.sum",
]

[type.svg]
extend-glob = ["*.svg"]
check-file = false

[type.png]
extend-glob = ["*.png"]
check-file = false

[default.extend-words]
"Parms" = "Parms"
"PARMS" = "PARMS"
"Encrypter" = "Encrypter"

[default.extend-identifiers]
"Parms" = "Parms"
"PARMS" = "PARMS"
"Encrypter" = "Encrypter"
